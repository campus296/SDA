<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Visualisateur de Monde RPG</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Monde RPG</h1>
        <p>Explorez le monde généré</p>
    </header>

    <main>

        <!-- Menu de gauche -->
        <aside>

            <section class="panneau">
                <h2>Informations</h2>

                <p>Taille du monde :</p>
                <p>Zone affichée :</p>
                <p>Status API :</p>
                <p>Tuiles chargées :</p>
            </section>

            <section class="panneau">
                <h2>Navigation</h2>

                <!-- Pour le moment les boutons ne font rien du tout c'est seulement pour mettre une indication de leur utilisation -->
                <div class="navigation">
                    <button onclick="Deplacement()">↑ Nord</button>

                    <div>
                        <button onclick="Deplacement()">Ouest</button>
                        <button onclick="Actualiser()">↻</button>
                        <button onclick="Deplacement()">Est →</button>
                    </div>

                    <button onclick="Deplacement()">↓ Sud</button>
                </div>
            </section>

            <section class="panneau">
                <h2>Légende</h2>

                <p>🟩 Herbe 🌱</p>
                <p>🟦 Eau 🌊</p>
                <p>🟥 Montagne 🏔️</p>
                <p>🟫 Forêt 🌲</p>
                <p>🟧 Ville 🏢</p>
                <p>⬛ Route 🛣️</p>
            </section>

            <section class="panneau">
                <h2>Tuile sélectionnée</h2>

                <p>Position :</p>
                <p>Type :</p>
                <p>Traversable :</p>
                <p>Description :</p>
            </section>

        </aside>

        <!-- Zone principale -->
        <section class="contenu">

            <div class="titre-carte">
                <h2>Carte du Monde</h2>
            </div>

            <div class="carte">
                <button class="case" ></button>
                <button class="case" ></button>
                <button class="case" ></button>
                <button class="case" ></button>
                <button class="case" ></button>

                <button class="case" ></button>
                <button class="case" ></button>
                <button class="case" ></button>
                <button class="case" ></button>
                <button class="case" ></button>

                <button class="case" ></button>
                <button class="case" ></button>
                <button class="case" ></button>
                <button class="case" ></button>
                <button class="case" ></button>

                <button class="case" ></button>
                <button class="case" ></button>
                <button class="case" ></button>
                <button class="case" ></button>
                <button class="case" ></button>

                <button class="case" ></button>
                <button class="case" ></button>
                <button class="case" ></button>
                <button class="case"></button>
                <button class="case"></button>
            </div>

        </section>

    </main>
    <script src="js/script.js"></script>
</body>
</html>
